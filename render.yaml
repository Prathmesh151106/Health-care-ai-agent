services:
  # ─── Backend API ────────────────────────────────────────────────────────────
  - type: web
    name: daily-health-companion-api
    runtime: node
    plan: free          # change to 'starter' or higher for production
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: daily-health-companion-db
          property: connectionString
      - key: DATABASE_SSL
        value: "true"
      # ── You must set these in the Render dashboard (not here) ─────────────
      # FRONTEND_URL          – your Vercel production URL
      # LOCAL_FRONTEND_URL    – http://localhost:5173
      # SUPABASE_URL          – your Supabase project URL
      # SUPABASE_JWT_SECRET   – from Supabase → Settings → API (secret)
      # AI_PROVIDER_API_KEY   – optional; omit for demo mode
      # AI_MODEL              – optional; default gpt-4o-mini

  # ─── PostgreSQL database ─────────────────────────────────────────────────
databases:
  - name: daily-health-companion-db
    plan: free          # change for production; free tier has limited storage
    databaseName: daily_health_companion
    user: dhc_user
